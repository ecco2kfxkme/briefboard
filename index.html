<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Briefboard: локальная kanban-доска для продуктовых и контентных задач.">
  <title>Briefboard - product workflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#board" aria-label="Briefboard, к доске"><span>B</span>Briefboard</a>
      <div class="top-actions">
        <button class="button ghost" id="theme" type="button" aria-label="Сменить тему">Тема</button>
        <button class="button ghost" id="import" type="button">Импорт</button>
        <button class="button primary" id="export" type="button">Экспорт JSON</button>
        <input id="import-file" type="file" accept="application/json" hidden>
      </div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Локальный workspace</p>
        <h1 id="page-title">Работа движется.<br>Видно почему.</h1>
      </div>
      <p>Планируйте задачи, меняйте этапы и выгружайте данные. Без регистрации и серверов.</p>
    </section>

    <section class="metrics" aria-label="Статистика доски">
      <article><span>Всего</span><strong id="metric-total">0</strong></article>
      <article><span>В работе</span><strong id="metric-active">0</strong></article>
      <article><span>Готово</span><strong id="metric-done">0</strong></article>
      <article><span>Прогресс</span><strong id="metric-progress">0%</strong></article>
    </section>

    <form id="task-form" class="composer">
      <label>Задача<input id="title" maxlength="70" placeholder="Собрать экран онбординга" required></label>
      <label>Проект<input id="project" maxlength="35" placeholder="Launch" required></label>
      <label>Этап<select id="status"><option value="backlog">Бэклог</option><option value="progress">В работе</option><option value="review">Проверка</option><option value="done">Готово</option></select></label>
      <label>Приоритет<select id="priority"><option value="high">Высокий</option><option value="medium">Средний</option><option value="low">Низкий</option></select></label>
      <label>Срок<input id="due" type="date"></label>
      <button class="button primary add" type="submit">Добавить задачу</button>
    </form>

    <section class="toolbar" aria-label="Фильтры задач">
      <label class="search"><span>Поиск</span><input id="search" type="search" placeholder="Название или проект"></label>
      <label><span>Приоритет</span><select id="priority-filter"><option value="all">Любой</option><option value="high">Высокий</option><option value="medium">Средний</option><option value="low">Низкий</option></select></label>
      <button class="button ghost" id="clear-filters" type="button">Сбросить</button>
    </section>

    <section id="board" class="board" aria-label="Kanban-доска" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
